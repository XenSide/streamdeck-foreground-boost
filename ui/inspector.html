<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="sdpi.css" />
</head>
<body>
	<div class="sdpi-wrapper">
		<div class="sdpi-item">
			<div class="sdpi-item-label">Boost</div>
			<select class="sdpi-item-value select" id="target">
				<option value="">Focused app</option>
			</select>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label empty"></div>
			<button class="sdpi-item-value" id="refresh" style="max-width:140px;">Refresh list</button>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label">Amount</div>
			<div class="sdpi-item-value" style="display:flex;align-items:center;gap:8px;">
				<input type="range" id="step" min="1" max="100" value="15" style="flex:1;min-width:0;width:auto;" />
				<span id="stepVal" style="min-width:3em;">±15%</span>
			</div>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label">Style</div>
			<select class="sdpi-item-value select" id="style">
				<option value="default">Default</option>
				<option value="duotone">Duotone</option>
			</select>
		</div>
		<div class="sdpi-item" id="duoItem" style="display:none;">
			<div class="sdpi-item-label">Colour</div>
			<select class="sdpi-item-value select" id="duoPreset">
				<option value="blue">Blue</option>
				<option value="orange">Orange</option>
				<option value="purple">Purple</option>
				<option value="red">Red</option>
				<option value="custom">Custom…</option>
			</select>
		</div>
		<div class="sdpi-item" type="color" id="duoCustom" style="display:none;">
			<div class="sdpi-item-label">Custom</div>
			<div class="sdpi-item-value" style="display:flex;gap:8px;align-items:center;">
				<input type="color" id="duoBg" value="#3b4c66" title="Background" />
				<input type="color" id="duoAccent" value="#67a4ff" title="Accent" />
			</div>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label empty"></div>
			<div class="sdpi-item-value" style="opacity:.7;">The chosen app gets louder by this share of its own volume (50%: 40 → 60), every other app quieter by the same share (40 → 20). One boost at a time: another Foreground Boost key switches to its own boost, this key again turns it off.</div>
		</div>
	</div>

	<script>
		let ws, uuid, settings = {};
		const $ = (id) => document.getElementById(id);
		const show = () => { $('stepVal').textContent = '±' + $('step').value + '%'; };
		const save = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings })); };

		window.connectElgatoStreamDeckSocket = (port, inUUID, registerEvent, info, actionInfo) => {
			uuid = inUUID;
			try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch { settings = {}; }
			$('step').value = settings.step != null ? settings.step : 15; show();
			styleToUi();
			fillApps([]);
			ws = new WebSocket('ws://127.0.0.1:' + port);
			ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid: inUUID }));
			ws.onmessage = (e) => {
				let m; try { m = JSON.parse(e.data); } catch { return; }
				if (m.event === 'sendToPropertyInspector' && m.payload && m.payload.apps) fillApps(m.payload.apps);
			};
		};

		function fillApps(apps) {
			const sel = $('target'), cur = settings.target || '';
			sel.innerHTML = '<option value="">Focused app</option>';
			let found = !cur;
			for (const a of apps) {
				const o = new Option(a.displayName, a.executableFile, false, a.executableFile === cur);
				o.dataset.name = a.displayName;
				found = found || a.executableFile === cur;
				sel.add(o);
			}
			if (!found) {
				const o = new Option((settings.targetName || cur) + ' (no audio now)', cur, false, true);
				o.dataset.name = settings.targetName || '';
				sel.add(o);
			}
		}

		$('target').addEventListener('change', () => {
			const o = $('target').selectedOptions[0];
			settings.target = o.value;
			settings.targetName = o.value ? o.dataset.name : '';
			save();
		});
		$('refresh').addEventListener('click', (e) => {
			e.preventDefault();
			if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'sendToPlugin', action: 'com.xenside.foregroundboost.toggle', context: uuid, payload: { kind: 'refreshApps' } }));
		});
		// Style: "default" (stock Stream Deck look) or "duotone" (Duotone Essentials colours).
		function styleToUi() {
			$('style').value = settings.style === 'duotone' ? 'duotone' : 'default';
			$('duoPreset').value = settings.duoPreset || 'blue';
			$('duoBg').value = settings.duoBg || '#3b4c66';
			$('duoAccent').value = settings.duoAccent || '#67a4ff';
			const duo = $('style').value === 'duotone';
			$('duoItem').style.display = duo ? '' : 'none';
			$('duoCustom').style.display = duo && $('duoPreset').value === 'custom' ? '' : 'none';
		}
		for (const id of ['style', 'duoPreset', 'duoBg', 'duoAccent']) $(id).addEventListener('change', () => { settings[id] = $(id).value; styleToUi(); save(); });
		$('step').addEventListener('input', show);
		$('step').addEventListener('change', () => { settings.step = parseInt($('step').value, 10); save(); });
	</script>
</body>
</html>
